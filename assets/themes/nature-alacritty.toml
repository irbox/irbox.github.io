# Nature (Choroid v4.0) Theme for Alacritty
# Grounded in Retinal Neurobiology & Myopia Research
# (Aleman et al. 2018; Swiatczak & Schaeffel 2022; Ingrassia et al. 2024)
# Default variant: Deep (16.5:1 max contrast, myopia-informed baseline)

[colors.primary]
background = "#0A0F14"
foreground = "#E9EEF3"

[colors.cursor]
text = "#0A0F14"
cursor = "#4FD1C5"

[colors.selection]
text = "#E9EEF3"
background = "#22313D"

[colors.normal]
black = "#22313D"
red = "#F2736D"
green = "#8FD694"
yellow = "#F2CC6B"
blue = "#6CB6FF"
magenta = "#B392F0"
cyan = "#4FD1C5"
white = "#B4C0CB"

[colors.bright]
black = "#74889A"
red = "#F2736D"
green = "#8FD694"
yellow = "#F2CC6B"
blue = "#6CB6FF"
magenta = "#B392F0"
cyan = "#4FD1C5"
white = "#E9EEF3"

