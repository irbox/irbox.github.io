<dialog
  class="search"
  id="search-dialog"
  aria-label="Search the site"
  data-index="{{ '/search.json' | relative_url }}"
>
  <div class="search__box">
    {% include icon.html name="search" size=18 %}
    <input
      type="search"
      id="search-input"
      placeholder="Search docs, projects and posts…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Search"
    >
    <button class="icon-btn" type="button" data-search-close aria-label="Close search">
      {% include icon.html name="close" size=18 %}
    </button>
  </div>
  <ul class="search__results" id="search-results" aria-label="Search results"></ul>
  <div class="sr-only" aria-live="polite" id="search-status"></div>
  <p class="search__hint">↑↓ to navigate · Enter to open · Esc to close</p>
</dialog>
