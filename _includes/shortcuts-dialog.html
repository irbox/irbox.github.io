<dialog class="shortcuts-dialog" id="shortcuts-dialog" aria-label="Keyboard Shortcuts">
  <div class="shortcuts-dialog__inner">
    <div class="shortcuts-dialog__header">
      <div class="shortcuts-dialog__title-group">
        {% include icon.html name="keyboard" size=20 %}
        <h2 class="shortcuts-dialog__title">Keyboard Shortcuts</h2>
      </div>
      <button class="icon-btn" type="button" data-shortcuts-close aria-label="Close shortcuts">
        {% include icon.html name="close" size=18 %}
      </button>
    </div>
    <div class="shortcuts-dialog__content">
      <div class="shortcuts-group">
        <h3 class="shortcuts-group__title">Navigation</h3>
        <dl class="shortcuts-list">
          <div class="shortcuts-item">
            <dt><kbd>H</kbd></dt>
            <dd>Home</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>D</kbd></dt>
            <dd>Documentation</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>P</kbd></dt>
            <dd>Projects</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>B</kbd></dt>
            <dd>Blog</dd>
          </div>
        </dl>
      </div>
      <div class="shortcuts-group">
        <h3 class="shortcuts-group__title">General</h3>
        <dl class="shortcuts-list">
          <div class="shortcuts-item">
            <dt><kbd>/</kbd> <span class="or">or</span> <kbd>Ctrl</kbd> <kbd>K</kbd></dt>
            <dd>Search site</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>T</kbd></dt>
            <dd>Toggle light / dark theme</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>?</kbd></dt>
            <dd>Toggle keyboard shortcuts</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>Ctrl</kbd> <kbd>P</kbd></dt>
            <dd>Print / Export PDF</dd>
          </div>
          <div class="shortcuts-item">
            <dt><kbd>Esc</kbd></dt>
            <dd>Close dialog</dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</dialog>
