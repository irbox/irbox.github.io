{%- comment -%} Structured Data (Schema.org JSON-LD) {%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {%- if page.layout == 'post' %}
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | truncate: 200 | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | jsonify }}
  },
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ '/about/' | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }}
  }
  {%- elsif page.layout == 'docs' %}
  "@type": "TechArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.title | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | jsonify }}
  },
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }}
  }
  {%- elsif page.layout == 'project' %}
  "@type": "SoftwareApplication",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | truncate: 200 | jsonify }},
  "applicationCategory": {{ page.category | default: "DeveloperApplication" | jsonify }},
  "operatingSystem": "Any",
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }}
  }
  {%- else %}
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": {{ site.description | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ '/about/' | absolute_url | jsonify }}
  }
  {%- endif %}
}
</script>
