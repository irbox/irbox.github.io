name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Pure C23 Native Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout (Pure C)
        run: |
          git init
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Compile and Generate Site (Pure C23)
        run: |
          make build OUT=_site

      - name: Publish to Pages (Pure C Git Plumbing)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TMP_IDX=$(mktemp -u)
          GIT_INDEX_FILE="$TMP_IDX" git --work-tree=_site add -A
          TREE=$(GIT_INDEX_FILE="$TMP_IDX" git write-tree)
          rm -f "$TMP_IDX"
          COMMIT=$(git commit-tree "$TREE" -m "deploy: ${GITHUB_SHA} (pure C23 build)")
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$COMMIT:refs/heads/gh-pages" --force
